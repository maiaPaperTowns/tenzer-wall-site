  <meta name="description" content="A peaceful touch-responsive living ink prototype for the Tenzer Wall.">
  <title>Living Ink — Tenzer Wall Study</title>
  <link rel="preload" href="assets/aoyagi-kouzan.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/cherry-blossom-cluster.png" as="image">
  <link rel="preload" href="assets/cherry-blossom-spray.png" as="image">
  <link rel="preload" href="assets/cherry-blossom-bough.png" as="image">
  <link rel="preload" href="assets/cherry-blossom-heads.png" as="image">
  <link rel="preload" href="assets/golden-sun-clouds.png" as="image">
  <link rel="preload" href="assets/sun-golden-currents.png" as="image">
  <link rel="preload" href="assets/rainbow-full-canvas.png" as="image">
  <link rel="preload" href="assets/rain-ink-village.png" as="image">
  <link rel="preload" href="assets/painted-bird-species.png" as="image">
  <link rel="preload" href="assets/mountain-layers.png" as="image">
  <link rel="preload" href="assets/thunder-storm-clouds.png" as="image">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23edf1ee'/%3E%3Cpath d='M32 49V28m0 8c-8-1-13-6-14-13 8-1 14 3 14 10m0 3c8-1 13-6 14-13-8-1-14 3-14 10' fill='none' stroke='%23354b59' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='18' r='7' fill='%23dd9dad'/%3E%3C/svg%3E">

</head>
<body>
  <main id="experience" aria-label="Interactive falling Kanji artwork">
    <img class="landscape" src="assets/quiet-courtyard.webp" alt="">
    <canvas id="art" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <section class="intro" id="intro">
      <p class="eyebrow">TENZER WALL STUDY · PROTOTYPE 01</p>
      <h1>Touch the living ink.</h1>
      <p>Each character holds a world.</p>
      <button id="begin" type="button">Begin</button>
    </section>
    <div class="hint" id="hint" aria-live="polite">Touch a character</div>
    <button class="sound" id="sound" type="button" aria-label="Toggle ambient sound" aria-pressed="false">Sound off</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
